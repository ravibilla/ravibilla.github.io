<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ravi Billa</title>
<meta name="description" content="Ravi Billa — personal site." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf7;
    --ink: #161616;
    --ink-soft: #555;
    --ink-mute: #9a9a95;
    --rule: #d9d6cc;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 64px 24px;
    line-height: 1.55;
  }

  main {
    width: 100%;
    max-width: 420px;
    text-align: left;
    animation: fade 600ms ease both;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .mark {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .meta {
    margin: 0 0 24px;
    color: var(--ink-mute);
    font-size: 14px;
  }

  .meta .sep { margin: 0 6px; color: var(--rule); }

  .bio {
    margin: 0 0 32px;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 36ch;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0 0 18px;
  }

  .label {
    color: var(--ink-mute);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .links {
    list-style: none;
    margin: 0 0 28px;
    padding: 0;
    display: grid;
    gap: 8px;
  }

  .links a {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    padding: 2px 0;
    width: fit-content;
    border-bottom: 1px solid transparent;
    transition: border-color 120ms ease, color 120ms ease;
  }

  .links a:hover { border-color: var(--ink); }

  .links a .arrow {
    color: var(--ink-mute);
    font-size: 13px;
    transition: transform 120ms ease, color 120ms ease;
  }

  .links a:hover .arrow {
    transform: translate(2px, -1px);
    color: var(--ink);
  }

  footer {
    margin-top: 40px;
    color: var(--ink-mute);
    font-size: 12px;
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">R</div>

    <h1>Ravi Billa</h1>
    <p class="meta">
      Software engineer
      <span class="sep">·</span>
      Ottawa
    </p>

    <p class="bio">Lifelong learner and tinkerer.</p>

    <hr />

    <div class="label">Elsewhere</div>
    <ul class="links">
      <li><a href="https://github.com/ravibilla" target="_blank" rel="noopener">GitHub <span class="arrow">↗</span></a></li>
      <li><a href="https://www.linkedin.com/in/ravibilla" target="_blank" rel="noopener">LinkedIn <span class="arrow">↗</span></a></li>
      <li><a href="https://x.com/ravibilla" target="_blank" rel="noopener">X / Twitter <span class="arrow">↗</span></a></li>
      <li><a href="mailto:billaravi@gmail.com">Email <span class="arrow">→</span></a></li>
    </ul>

    <footer>© <span id="y"></span> Ravi Billa</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
